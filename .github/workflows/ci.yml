name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  preset: release,    label: "linux-clang",
              cc: clang, cxx: clang++ }
          - { os: macos-latest,   preset: release,    label: "macos-clang" }
          - { os: windows-latest, preset: ninja-msvc, label: "windows-msvc" }

    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja (Linux/macOS)
        if: runner.os != 'Windows'
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Set up MSVC + Ninja (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Select compiler
        if: matrix.cc
        run: |
          echo "CC=${{ matrix.cc }}"   >> $GITHUB_ENV
          echo "CXX=${{ matrix.cxx }}" >> $GITHUB_ENV

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -G Ninja

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 4

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --parallel 2 --timeout 600

      - name: Perf gate (Linux Clang)
        if: matrix.label == 'linux-clang'
        run: python3 ci/perf_check.py --build-dir build/${{ matrix.preset }}
